<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle-Answer</title><style nonce="__TOKEN__">
:root{color-scheme:light dark;font-family:system-ui,sans-serif;background:light-dark(#f5f6f8,#11141b);color:light-dark(#1b2433,#e5eaf4)}
*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:28px 20px}header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}h1{font-size:24px;margin:0}header p{color:light-dark(#536176,#a4b2c7)}section{margin-top:22px}label{display:block;font-size:14px;margin-bottom:6px}textarea{width:100%;min-height:120px;resize:vertical;padding:12px;border:1px solid light-dark(#c9d1df,#3d4a60);border-radius:10px;background:light-dark(#fff,#1b2230);color:inherit;font:inherit}button,select{font:inherit;padding:9px 13px;border:1px solid light-dark(#c9d1df,#3d4a60);border-radius:8px;background:light-dark(#fff,#1b2230);color:inherit}button{cursor:pointer}button.primary{background:#345edb;color:white;border-color:#345edb}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.row select{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6;margin:0}.muted{color:light-dark(#536176,#a4b2c7);font-size:13px}.answer{background:light-dark(#fff,#1b2230);padding:20px;border-radius:12px;min-height:90px}.approval{border:2px solid #b98b32;padding:16px;border-radius:10px}.approval button{margin:10px 10px 0 0}.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.evidence img{width:100%;border-radius:8px}#events{max-height:160px;overflow:auto;font:13px ui-monospace,monospace;padding:0;list-style:none}#events li{padding:4px 0}#status{font-weight:600}#error{color:light-dark(#a21a29,#ff9aa6)}:focus-visible{outline:3px solid #7597ff;outline-offset:2px}input[type=file]{max-width:100%}[hidden]{display:none!important}
</style></head><body><main>
<header><h1>Battle-Answer</h1><p>One agent for everyday work. Arena when alternatives matter.</p></header>
<section><label for="task">Your task</label><textarea id="task" placeholder="Inspect my project, research a question, or compare alternatives..."></textarea>
<div class="row"><div><label for="mode">Workflow</label><select id="mode"><option value="auto">Auto</option><option value="single">Single assistant</option><option value="arena">Arena tournament</option></select></div><div><label for="role">Role</label><select id="role"><option value="general">General</option><option value="coder">Coder</option><option value="researcher">Researcher</option><option value="reviewer">Reviewer</option></select></div><button id="send" class="primary">Run task</button></div>
<p class="muted">Uses the server's configured model and isolated project copy. API keys stay in the server environment.</p>
<label for="files">Attach text files (up to 3, 8,000 characters each)</label><input id="files" type="file" multiple accept=".txt,.md,.py,.js,.ts,.json,.csv,.html,.css"><p id="attachments" class="muted"></p></section>
<section><p id="status" role="status" aria-live="polite">Ready</p><p id="error" role="alert"></p><ul id="events" aria-label="Tool and model progress"></ul></section>
<section id="approval" class="approval" hidden><label>Permission required</label><pre id="action"></pre><button id="allow">Approve this action</button><button id="deny">Deny</button></section>
<section><label>Answer</label><div class="answer"><pre id="answer">Your result will appear here.</pre></div><p id="details" class="muted"></p></section>
<section><label>Browser evidence</label><div id="screenshots" class="evidence"></div></section>
</main><script nonce="__TOKEN__">
const token='__TOKEN__';const el=id=>document.getElementById(id);let pending=null;let shown='';
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Arena-Token':token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d;}
el('send').addEventListener('click',async()=>{try{el('error').textContent='';let task=el('task').value;const selected=[...el('files').files];if(selected.length>3)throw new Error('Choose at most three text files.');for(const file of selected){if(file.size>256000)throw new Error('Attachment too large: '+file.name);task+='\n\nATTACHED TEXT '+file.name+'\n'+(await file.text()).slice(0,8000);}await post('/api/ask',{task,mode:el('mode').value,role:el('role').value});el('send').disabled=true;el('answer').textContent='Working...';}catch(e){el('error').textContent=e.message;}});
el('files').addEventListener('change',()=>el('attachments').textContent=[...el('files').files].map(f=>f.name).join(', '));
for(const [id,allow] of [['allow',true],['deny',false]])el(id).addEventListener('click',async()=>{try{await post('/api/approve',{id:pending.id,allow});el('approval').hidden=true;}catch(e){el('error').textContent=e.message;}});
async function refresh(){try{const r=await fetch('/api/state');const s=await r.json();el('send').disabled=s.running;el('status').textContent=s.running?'Working':'Ready';el('events').replaceChildren(...s.events.map(e=>{const li=document.createElement('li');li.textContent=e.type==='route'?'Workflow: '+e.mode:e.type==='request'?'Model request: '+e.model:'Tool: '+e.name+' ('+(e.ok?'completed':'failed')+')';return li;}));pending=s.approval;el('approval').hidden=!pending;if(pending)el('action').textContent=pending.tool+'\n'+JSON.stringify(pending.arguments,null,2);if(s.error)el('error').textContent=s.error;if(s.answer){el('answer').textContent=s.answer.answer;el('details').textContent='Workflow: '+s.answer.mode+' · Status: '+(s.answer.status||s.answer.report?.status||'needs_review');}const key=s.screenshots.join();if(key!==shown){shown=key;el('screenshots').replaceChildren(...s.screenshots.map(name=>{const a=document.createElement('a');a.href='/artifacts/'+encodeURIComponent(name);a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=a.href;img.alt='Browser evidence '+name;a.append(img);return a;}));}}catch(e){el('status').textContent='Connection unavailable';}setTimeout(refresh,700);}refresh();
</script></body></html>

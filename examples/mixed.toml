[worker]
provider = "gemini"
model = "gemini-2.5-flash"
api_key_env = "GEMINI_API_KEY"
max_output_tokens = 8192

[judge]
provider = "anthropic"
model = "claude-sonnet-4-5"
api_key_env = "ANTHROPIC_API_KEY"
max_output_tokens = 4096

# Optional: used if a worker OR judge cannot satisfy the JSON protocol after repairs.
[fallback]
provider = "groq"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"

[arena]
agents = 4
judge_votes = 2
max_calls = 200
max_total_tokens = 800000
# Optional, exact HTTPS hosts; no redirects, authenticated browser, or JavaScript rendering.
web_hosts = ["docs.python.org"]
# To verify generated Python code, pull the image and invoke arena run --allow-exec.
# docker_image = "python:3.12-slim"
# verify_argv = ["python", "-m", "unittest", "discover", "-s", "tests"]

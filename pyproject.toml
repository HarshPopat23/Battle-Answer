[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-standalone"
version = "0.3.0"
description = "Provider-configurable solution tournaments with local tools and evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
mcp = ["mcp>=1.30,<2", "jsonschema>=4.23,<5"]
documents = ["pypdf>=5,<7"]
all = ["playwright>=1.50,<2", "mcp>=1.30,<2", "jsonschema>=4.23,<5", "pypdf>=5,<7"]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools]
packages = ["arena"]

[tool.setuptools.package-data]
arena = ["strategies.json", "rubric.md", "prompts.md", "web/*.html"]
